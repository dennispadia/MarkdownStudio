name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows build run ID to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified build
        id: build
        uses: actions/github-script@v8
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const repo = context.repo;
            if (!/^\d+$/.test(process.env.BUILD_RUN_ID)) throw new Error('Invalid build run ID.');
            const run_id = Number(process.env.BUILD_RUN_ID);
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id });
            if (run.conclusion !== 'success' || run.head_branch !== 'main' ||
                run.path !== '.github/workflows/windows.yml' ||
                run.head_repository.full_name !== `${repo.owner}/${repo.repo}`) {
              throw new Error('Select a successful main-branch Windows build from this repository.');
            }
            const { data: manifest } = await github.rest.repos.getContent({
              ...repo, path: 'package.json', ref: run.head_sha,
            });
            const version = JSON.parse(Buffer.from(manifest.content, 'base64').toString('utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Unsupported release version.');
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...repo, run_id });
            const artifacts = data.artifacts.filter(a => a.name === 'lekh-windows-x64' && !a.expired);
            if (artifacts.length !== 1) throw new Error('Expected exactly one verified Windows artifact.');
            const artifact = artifacts[0];
            const download = await github.rest.actions.downloadArtifact({
              ...repo, artifact_id: artifact.id, archive_format: 'zip',
            });
            const bytes = Buffer.from(download.data);
            if (artifact.digest !== `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`) {
              throw new Error('Artifact digest mismatch.');
            }
            fs.writeFileSync('verified-release.zip', bytes);
            core.setOutput('sha', run.head_sha);
            core.setOutput('version', version);
            core.setOutput('run_url', run.html_url);
      - name: Extract release assets
        run: unzip -q verified-release.zip -d release-assets
      - name: Verify checksums and publish release assets
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ steps.build.outputs.sha }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
          BUILD_URL: ${{ steps.build.outputs.run_url }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const repo = context.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            const names = [`Lekh-Markdown-editor-${version}-x64.msi`, `Lekh-${version}-source.zip`, 'SHA256SUMS.txt'];
            const entries = fs.readdirSync('release-assets').sort();
            if (JSON.stringify(entries) !== JSON.stringify([...names].sort())) throw new Error('Unexpected artifact files.');
            const hashes = new Map();
            for (const name of names) {
              hashes.set(name, crypto.createHash('sha256').update(fs.readFileSync(`release-assets/${name}`)).digest('hex'));
            }
            const lines = fs.readFileSync('release-assets/SHA256SUMS.txt', 'utf8').trim().split(/\r?\n/);
            const checked = new Set();
            for (const line of lines) {
              const match = /^([a-f0-9]{64})  (.+)$/.exec(line);
              if (!match || !names.slice(0, 2).includes(match[2]) || checked.has(match[2]) ||
                  hashes.get(match[2]) !== match[1]) throw new Error('Release checksum mismatch.');
              checked.add(match[2]);
            }
            if (checked.size !== 2) throw new Error('Missing release checksum.');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            let release = releases.find(r => r.tag_name === tag);
            if (release && !release.draft) throw new Error('Release is already published; refusing to replace assets.');
            if (release && release.target_commitish !== process.env.RELEASE_SHA) throw new Error('Draft targets a different build.');
            if (!release) {
              const body = `Windows x64, per-user installer. No Node.js, Word or Pandoc required.\n\n` +
                `**Unsigned software:** Windows may warn about or block installation. Verify SHA256SUMS.txt and follow your organization's policies; do not disable security protections.\n\n` +
                `[Verified build and complete extracted-app desktop tests](${process.env.BUILD_URL}). Real install/upgrade/repair/uninstall in a disposable VM have not been tested.\n\n` +
                `Shared as-is under MIT, with no support or promised maintenance. Independent forks and AI-assisted customization are welcome.`;
              ({ data: release } = await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: process.env.RELEASE_SHA,
                name: `Lekh ${version}`, body, draft: true, prerelease: false,
              }));
            }
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: release.id });
            if (existing.some(a => !names.includes(a.name))) throw new Error('Draft has unexpected assets.');
            for (const name of names) {
              const previous = existing.find(a => a.name === name);
              if (previous?.state === 'uploaded') {
                if (previous.digest !== `sha256:${hashes.get(name)}`) throw new Error(`Existing asset differs: ${name}`);
                continue;
              }
              if (previous) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: previous.id });
              const data = fs.readFileSync(`release-assets/${name}`);
              const { data: asset } = await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              });
              if (asset.name !== name || asset.state !== 'uploaded' || asset.digest !== `sha256:${hashes.get(name)}`) {
                throw new Error(`Uploaded asset verification failed: ${name}`);
              }
            }
            const { data: published } = await github.rest.repos.updateRelease({
              ...repo, release_id: release.id, draft: false, make_latest: 'true',
            });
            core.notice(`Published ${published.html_url}`);
