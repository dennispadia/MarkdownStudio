name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Restore locked dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Unit tests
        run: npm test
      - name: Build per-user MSI
        run: npm run package:msi
      - name: Verify installer and extracted desktop application
        run: npm run verify:msi
      - name: Build offline native setup
        run: npm run build:setup
      - name: Verify setup engine, previews and hosted install/uninstall
        run: npm run verify:setup -- -InstallOnHostedRunner
      - name: Verify genuine 0.8.0 upgrade and 0.8.1 repair on hosted runner
        run: .\scripts\Test-Upgrade.ps1 -InstallOnHostedRunner
      - name: Create clean source archive
        run: npm run package:source
      - name: Create SHA-256 checksums
        run: npm run release:checksums
      - name: Read verified release version
        id: release
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Unsupported release version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload upgrade diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lekh-upgrade-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: build/setup/upgrade/**/*.log
      - name: Upload reviewed-download candidates
        uses: actions/upload-artifact@v4
        with:
          name: lekh-windows-x64
          if-no-files-found: error
          path: |
            release/Lekh-Markdown-editor-Setup-${{ steps.release.outputs.version }}-x64.exe
            release/Lekh-${{ steps.release.outputs.version }}-source.zip
            release/SHA256SUMS.txt
